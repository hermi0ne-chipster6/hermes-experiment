# Opt-in integration-repository workflow; paths assume this deliverable is the repository root.
name: Detect official Hermes stable releases
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 release/detect.py --output release-candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-release-review-candidate
          path: release-candidate.json
          if-no-files-found: error
