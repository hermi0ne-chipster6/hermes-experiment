# Adapted from Canonical's build workflow shape. No upload, release, or Store credentials.
# Use a disposable dedicated runner; never run untrusted fork code on an operator machine.
name: Hermes SDK compatibility
on:
  workflow_dispatch:
  pull_request:
    branches: [latest]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
  sdk:
    # Fork PRs may run hosted unit tests, never this sudo-capable runner.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        role: [hermes-experiment, hermes-execution, hermes-rea]
    runs-on: [self-hosted, linux, x64, hermes-sdk-build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require configured Ubuntu 26.04 AMD64 build and VM-test host
        run: |
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
          test "$(uname -m)" = x86_64
          test -r /dev/kvm
          workshop --version
          snap list workshop sdkcraft lxd
          sudo -n lxc info
      - name: Build and run Spread smoke suite
        working-directory: sdks/${{ matrix.role }}
        run: |
          sudo -n sdkcraft clean
          sudo -n sdkcraft try --build-for amd64
          sudo -n sdkcraft test --list | tee spread-jobs.txt
          test -s spread-jobs.txt
          sudo -n sdkcraft test
          sha256sum ./*.sdk > artifact-checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-${{ matrix.role }}
          path: |
            sdks/${{ matrix.role }}/*.sdk
            sdks/${{ matrix.role }}/artifact-checksums.txt
            sdks/${{ matrix.role }}/spread-jobs.txt
          if-no-files-found: error
