name: SDK packaging qualification
on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact candidate commit
        type: string
        required: true
      base_sha:
        description: Exact main commit the candidate extends
        type: string
        required: true
      human_candidate:
        description: Reviewed human PR with current main as an ancestor
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source:
    uses: ./.github/workflows/checks.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      base_sha: ${{ inputs.base_sha }}
      human_candidate: ${{ inputs.human_candidate }}
  sdk:
    if: >-
      github.repository == 'hermi0ne-chipster6/hermes-experiment' &&
      ((github.workflow_ref == format('{0}/.github/workflows/releases.yml@refs/heads/main', github.repository) && !inputs.human_candidate) ||
      (github.workflow_ref == format('{0}/.github/workflows/qualify-human-pr.yml@refs/heads/main', github.repository) && inputs.human_candidate))
    needs: source
    concurrency:
      group: hermes-sdk-build
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64, hermes-sdk-build]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}
      - name: Verify candidate against main
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          HUMAN_CANDIDATE: ${{ inputs.human_candidate }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          if test "$HUMAN_CANDIDATE" = true; then
            git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          else
            test "$(git rev-list --parents -n 1 HEAD)" = "$CANDIDATE_SHA $BASE_SHA"
          fi
      - name: Install locked inventory dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/pip" install --only-binary=:all: --require-hashes -r ci/requirements.txt
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Build and exercise Workshop A
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/hermes-qualification
        run: bash ci/qualify-sdk "$EVIDENCE_DIR"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hermes-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hermes-qualification/
          retention-days: 30
          if-no-files-found: error
  result:
    if: always()
    needs: [source, sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all qualification jobs to pass
        env:
          SOURCE: ${{ needs.source.result }}
          SDK: ${{ needs.sdk.result }}
        run: |
          printf 'Source checks: %s\nSDK qualification: %s\n' "$SOURCE" "$SDK" >> "$GITHUB_STEP_SUMMARY"
          test "$SOURCE" = success
          test "$SDK" = success
