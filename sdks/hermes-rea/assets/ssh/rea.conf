# Operator must install A's public key at this root-owned path before enabling access.
PermitUserEnvironment no
Match User rea
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/hermes-rea/authorized_keys
    ForceCommand /usr/local/bin/hermes-rea-stdio
    DisableForwarding yes
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitUserRC no
