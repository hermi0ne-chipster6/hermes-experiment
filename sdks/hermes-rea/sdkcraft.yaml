# Existing Canonical SDK patterns retained; active pins: SOURCE.json and dependencies/assets.json.
name: hermes-rea
adopt-info: rea
summary: REA CLI and MCP analysis engine with Linux providers
description: |
  Pinned upstream REA CLI and MCP engine with Ghidra, Android, JavaScript,
  firmware and offline analysis providers. Restricted SSH stdio access and
  persistent analysis state retain the dedicated worker interface.
license: MIT AND Apache-2.0 AND GPL-2.0-only AND GPL-3.0-or-later AND BSD-3-Clause AND (LGPL-2.0 WITH WxWindows-exception-3.1)
platforms:
  amd64: null
parts:
  node-runtime:
    plugin: dump
    source: https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz
    source-checksum: sha256/6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6
    organize:
      '*': node/
  rea:
    plugin: dump
    source: https://codeload.github.com/morluto/rea/tar.gz/51459cf203ae1eb6b586a95b21899eaa0f631823
    source-type: tar
    source-checksum: sha256/6b826f0014436d9cba4dd27e5b7e08ec395cdac5fce321daebe10263e9460beb
    after:
    - node-runtime
    override-build: |
      craftctl set version="$(cat "$CRAFT_PROJECT_DIR/VERSION")"
      export PATH="$CRAFT_STAGE/node/bin:$PATH"
      export HUSKY=0 TURBO_TELEMETRY_DISABLED=1
      npm ci --ignore-scripts --no-audit --no-fund
      npm run build:cached
      node scripts/generate-skill-metadata.mjs --check
      node scripts/generate-cursor-plugin-skill.mjs --check
      npm pack --ignore-scripts --pack-destination "$CRAFT_PART_BUILD"
      npm prune --omit=dev --ignore-scripts --no-audit --no-fund
      mkdir -p "$CRAFT_PART_INSTALL/rea/node_modules/rea-agents"
      cp -a node_modules/. "$CRAFT_PART_INSTALL/rea/node_modules/"
      # Replace the pinned upstream Frida module with the matched official fix
      # supplied by frida-runtime/native; preserve the original engine lock.
      rm -rf "$CRAFT_PART_INSTALL/rea/node_modules/frida"
      tar -xzf "$CRAFT_PART_BUILD/rea-agents-6.9.0.tgz" --strip-components=1 -C "$CRAFT_PART_INSTALL/rea/node_modules/rea-agents"
      # The upstream published-files list omits inputs used by the operational
      # `rea setup --desktop-build` workflow. Preserve those unchanged too.
      cp scripts/pack-build-computer-runtime.mjs "$CRAFT_PART_INSTALL/rea/node_modules/rea-agents/scripts/"
      cp scripts/lib/npm-invocation.mjs "$CRAFT_PART_INSTALL/rea/node_modules/rea-agents/scripts/lib/"
      cp package-lock.json "$CRAFT_PART_INSTALL/rea/node_modules/rea-agents/"
      cp package-lock.json "$CRAFT_PART_INSTALL/rea/upstream-package-lock.json"
      printf '%s\n' 51459cf203ae1eb6b586a95b21899eaa0f631823 > "$CRAFT_PART_INSTALL/rea/UPSTREAM_COMMIT"
  assets:
    plugin: dump
    source: assets
    source-type: local
    override-build: |
      craftctl default
      # A publisher's restrictive checkout umask must not prevent the rea user
      # from reading immutable code or executing the installed launchers.
      chmod -R a+rX "$CRAFT_PART_INSTALL"
  upstream-source:
    plugin: nil
    source: https://github.com/morluto/rea.git
    source-type: git
    source-commit: 51459cf203ae1eb6b586a95b21899eaa0f631823
    source-depth: 1
    build-packages: [git, python3]
    override-build: |
      git -C "$CRAFT_PART_SRC" submodule update --init --recursive --depth 1
      /usr/bin/python3 "$CRAFT_PROJECT_DIR/dependencies/preserve-upstream-source.py"
    override-prime: |
      craftctl default
      cd "$CRAFT_PRIME/upstream"
      sha256sum --check rea.source.tar.gz.sha256
      # Intentional upstream malformed-link fixtures bypass Craft's stage stat
      # scan, while remaining unchanged in the immutable final SDK archive.
      rm -rf -- "$CRAFT_PRIME/upstream/rea"
      tar --extract --gzip --file=rea.source.tar.gz --no-same-owner --same-permissions
  cutter:
    plugin: nil
    source: https://github.com/rizinorg/cutter/releases/download/v2.5.0/Cutter-v2.5.0-Linux-Qt5-x86_64.AppImage
    source-type: file
    source-checksum: sha256/c796077954b419bd6ac36fafd0a0df36f21c8c90219dbfcfb486b34e0ad4bbc0
    override-build: |
      bash "$CRAFT_PROJECT_DIR/dependencies/build-cutter.sh"
  jadx:
    plugin: dump
    source: https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar
    source-checksum: sha256/6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75
    source-type: file
    organize:
      '*': providers/jadx.jar
  apktool:
    plugin: dump
    source: https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
    source-checksum: sha256/dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423
    source-type: file
    organize:
      '*': providers/apktool.jar
  wabt:
    plugin: dump
    source: https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-linux-x64.tar.gz
    source-checksum: sha256/84895407a6bbb80e918f33b16b2fb2206021c150b6bc9ff6f761263a745ab131
    organize:
      '*': providers/wabt/
  wakaru:
    plugin: dump
    source: https://github.com/pionxzh/wakaru/releases/download/v1.14.0/wakaru-linux-x64.tar.gz
    source-checksum: sha256/db0e620034723195ab426e94d00d55dbd8fd0106a928ada2563f1103196d09fa
    organize:
      wakaru: providers/bin/wakaru
  rizin:
    plugin: dump
    source: https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-v0.9.1-static-x86_64.tar.xz
    source-checksum: sha256/9102249a9f0b6319c5334a2e5cf8d9cc3f2035e1d3def027c41f6a90f647e8cf
    organize:
      '*': providers/rizin/
  kuna:
    plugin: dump
    source: https://github.com/Noelo-Lab/kuna/releases/download/v1.990/kuna-v1.990-linux-x86_64.tar.gz
    source-checksum: sha256/4860603084da39dcdebeb9155116a886f8294003af54cecdb6a687529f0b5f54
    organize:
      '*': providers/kuna/
  mitmproxy:
    plugin: dump
    source: https://downloads.mitmproxy.org/12.2.3/mitmproxy-12.2.3-linux-x86_64.tar.gz
    source-checksum: sha256/2e95286b618fa6fd33e5e62a78c2e5112571d85f42ec2bac29b97ee242bdb5c5
    organize:
      '*': providers/mitmproxy/
  nativeaot:
    plugin: dump
    source: https://codeload.github.com/morluto/rea/tar.gz/51459cf203ae1eb6b586a95b21899eaa0f631823
    source-type: tar
    source-checksum: sha256/6b826f0014436d9cba4dd27e5b7e08ec395cdac5fce321daebe10263e9460beb
    after: [node-runtime, ghidra]
    build-packages: [git, openjdk-25-jdk-headless]
    override-build: |
      git init third_party/ghidra-nativeaot
      git -C third_party/ghidra-nativeaot config remote.origin.url https://github.com/Washi1337/ghidra-nativeaot.git
      git -C third_party/ghidra-nativeaot fetch --depth 1 origin effeb734fc570c32650f88b159608979dc7b423e
      git -C third_party/ghidra-nativeaot checkout --detach FETCH_HEAD
      export GHIDRA_INSTALL_DIR="$CRAFT_STAGE/ghidra/ghidra_12.1.4_PUBLIC"
      export REA_NATIVEAOT_BUILD_ROOT="$CRAFT_PART_INSTALL/providers/nativeaot"
      "$CRAFT_STAGE/node/bin/node" scripts/build-ghidra-nativeaot.mjs
      rm "$REA_NATIVEAOT_BUILD_ROOT/javac.args"
  chromium:
    plugin: dump
    source: https://cdn.playwright.dev/builds/cft/156.0.8078.4/linux64/chrome-linux64.zip
    source-checksum: sha256/43fd31766c7533a02dda2ded5ad50c2f861cd5400be7509c0abad71129f79d79
    organize:
      '*': providers/chromium/
    stage:
    - -providers/chromium/chrome-linux64/WidevineCdm
  binwalk:
    plugin: dump
    source: https://codeload.github.com/ReFirmLabs/binwalk/tar.gz/4fdab3d464d97b68e0af9088df3f9e2e1545b21c
    source-type: tar
    source-checksum: sha256/81d9dbfbe4716446fe5167ed7046ebc3a6c33a18cc91f412a5392374c3622e20
    build-packages: [cargo, rustc, liblzma-dev, libbz2-dev, libfontconfig1-dev, pkg-config]
    override-build: |
      bash "$CRAFT_PROJECT_DIR/dependencies/build-binwalk.sh"
  unblob:
    plugin: nil
    build-packages: [python3-pip, libmagic1t64]
    override-build: |
      bash "$CRAFT_PROJECT_DIR/dependencies/build-unblob.sh"
  pwndbg:
    plugin: dump
    source: https://github.com/pwndbg/pwndbg.git
    source-type: git
    source-commit: 55596aa676a2756efb8d67034f31675170eabe48
    build-packages: [python3-venv, python3-pip, python3-dev, build-essential, git]
    override-build: |
      bash "$CRAFT_PROJECT_DIR/dependencies/build-pwndbg.sh"
  pwntools:
    plugin: nil
    build-packages: [python3-venv, python3-pip, python3-dev, build-essential, cmake]
    override-build: |
      bash "$CRAFT_PROJECT_DIR/dependencies/build-pwntools.sh"
  ilspy:
    plugin: dump
    source: https://api.nuget.org/v3-flatcontainer/ilspycmd.linux-x64/11.2.0.10050/ilspycmd.linux-x64.11.2.0.10050.nupkg
    source-type: zip
    source-checksum: sha256/5be3af86839e93075d103e5b4fec73a637b8d70e49c97eaf043ebe55b7c7800d
    build-packages: [libicu78]
    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/providers/ilspy" "$CRAFT_PART_INSTALL/providers/bin"
      cp -a "$CRAFT_PART_SRC/." "$CRAFT_PART_INSTALL/providers/ilspy/"
      chmod 755 "$CRAFT_PART_INSTALL/providers/ilspy/tools/any/linux-x64/ilspycmd"
      ln -s ../ilspy/tools/any/linux-x64/ilspycmd "$CRAFT_PART_INSTALL/providers/bin/ilspycmd"
      "$CRAFT_PART_INSTALL/providers/ilspy/tools/any/linux-x64/ilspycmd" --version
  agentenv:
    plugin: nil
    build-packages: [python3-venv, python3-pip]
    override-build: |
      bash "$CRAFT_PROJECT_DIR/dependencies/build-agentenv.sh"
  docker-client:
    plugin: dump
    source: https://archive.ubuntu.com/ubuntu/pool/universe/d/docker.io-app/docker.io_29.1.3-0ubuntu4.1_amd64.deb
    source-type: file
    source-checksum: sha256/7a77548bd669f232ec8852092623303be32c55538401ff047b4d1e0bb5ea721d
    override-build: |
      dpkg-deb -x "$CRAFT_PART_SRC/docker.io_29.1.3-0ubuntu4.1_amd64.deb" unpacked
      install -Dm755 unpacked/usr/bin/docker "$CRAFT_PART_INSTALL/providers/bin/docker"
      mkdir -p "$CRAFT_PART_INSTALL/providers/licenses/docker-client"
      cp -a unpacked/usr/share/doc/docker.io/. "$CRAFT_PART_INSTALL/providers/licenses/docker-client/"
      "$CRAFT_PART_INSTALL/providers/bin/docker" --version
  docker-buildx:
    plugin: dump
    source: https://archive.ubuntu.com/ubuntu/pool/universe/d/docker-buildx/docker-buildx_0.30.1-0ubuntu1_amd64.deb
    source-type: file
    source-checksum: sha256/96f1bf0fb16cefcd9063c2034b949383e46b1b47c26a376e3a569e42ffdf281e
    override-build: |
      dpkg-deb -x "$CRAFT_PART_SRC/docker-buildx_0.30.1-0ubuntu1_amd64.deb" unpacked
      install -Dm755 unpacked/usr/libexec/docker/cli-plugins/docker-buildx "$CRAFT_PART_INSTALL/providers/docker-cli-plugins/docker-buildx"
      mkdir -p "$CRAFT_PART_INSTALL/providers/licenses/docker-buildx"
      cp -a unpacked/usr/share/doc/docker-buildx/. "$CRAFT_PART_INSTALL/providers/licenses/docker-buildx/"
      "$CRAFT_PART_INSTALL/providers/docker-cli-plugins/docker-buildx" version
  docker-compose:
    plugin: dump
    source: https://archive.ubuntu.com/ubuntu/pool/universe/d/docker-compose-v2/docker-compose-v2_2.40.3+ds1-0ubuntu1_amd64.deb
    source-type: file
    source-checksum: sha256/fb8bbea5614c65cbdf426a7fd13bfeaf0f777a8f4d62758fbbfa4f051be330da
    override-build: |
      dpkg-deb -x "$CRAFT_PART_SRC/docker-compose-v2_2.40.3+ds1-0ubuntu1_amd64.deb" unpacked
      install -Dm755 unpacked/usr/libexec/docker/cli-plugins/docker-compose "$CRAFT_PART_INSTALL/providers/docker-cli-plugins/docker-compose"
      mkdir -p "$CRAFT_PART_INSTALL/providers/licenses/docker-compose"
      cp -a unpacked/usr/share/doc/docker-compose-v2/. "$CRAFT_PART_INSTALL/providers/licenses/docker-compose/"
      "$CRAFT_PART_INSTALL/providers/docker-cli-plugins/docker-compose" version
  sasquatch:
    plugin: dump
    source: https://github.com/onekey-sec/sasquatch/releases/download/sasquatch-v4.5.1-6/sasquatch_1.0_amd64.deb
    source-type: file
    source-checksum: sha256/efbc92bd27594e01211e1b582f105a463a0017360a0746a93de3f283906ade95
    override-build: |
      dpkg-deb -x "$CRAFT_PART_SRC/sasquatch_1.0_amd64.deb" unpacked
      mkdir -p "$CRAFT_PART_INSTALL/providers/bin" "$CRAFT_PART_INSTALL/providers/licenses"
      cp unpacked/usr/bin/sasquatch* "$CRAFT_PART_INSTALL/providers/bin/"
      cp -a unpacked/usr/share/doc/. "$CRAFT_PART_INSTALL/providers/licenses/"
  ghidra:
    plugin: dump
    source: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
    source-checksum: sha256/ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
    organize:
      '*': ghidra/
  frida-runtime:
    plugin: dump
    source: https://registry.npmjs.org/frida/-/frida-17.25.1.tgz
    source-type: tar
    source-checksum: sha256/81c475d3425a3748007efdc80ebd2c747a44694627e2aab11999675536f9ec04
    after: [rea]
    override-build: |
      craftctl default
      install -m 644 "$CRAFT_PROJECT_DIR/dependencies/frida-compatibility.json" "$CRAFT_PART_INSTALL/hermes-rea-compatibility.json"
    organize:
      '*': rea/node_modules/frida/
  frida-native:
    plugin: dump
    source: https://github.com/frida/frida/releases/download/17.25.1/frida-v17.25.1-napi-v8-linux-x64.tar.gz
    source-checksum: sha256/28f6bf3a8926288ffe79f415777256a37213c2d217cdab4ee81b225b096854bb
    after:
    - rea
    - frida-runtime
    override-build: 'BINDING=$(find "$CRAFT_PART_SRC" -type f -name frida_binding.node -print -quit)

      test -n "$BINDING"

      install -D -m 644 "$BINDING" "$CRAFT_PART_INSTALL/rea/node_modules/frida/build/frida_binding.node"

      timeout 30 "$CRAFT_STAGE/node/bin/node" -e ''require(process.argv[1])'' "$CRAFT_PART_INSTALL/rea/node_modules/frida/build/frida_binding.node"

      '
plugs:
  state:
    interface: mount
    workshop-target: /var/lib/hermes-rea
    uid: 0
    gid: 0
    mode: 493
  configuration:
    interface: mount
    workshop-target: /etc/hermes-experiment
    read-only: true
    uid: 0
    gid: 0
    mode: 493
base: ubuntu@26.04
