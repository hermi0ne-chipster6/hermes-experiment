summary: Launch hermes-rea and prove full MCP inventory, CLI and static workflows
prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch
  workshop changes
  workshop tasks
  workshop info
restore: |
  workshop remove || true
  workshop changes
  workshop tasks
  # info returns exit1 after successful removal; list proves the final Off state.
  workshop info || true
  workshop list --no-headers | MATCH '[[:space:]]Off[[:space:]]'
execute: |
  workshop exec -I </dev/null -- sudo -Hu rea bash -c 'cd /var/lib/hermes-rea/work && exec "$@"' -- /usr/local/bin/rea --version | MATCH "${EXPECTED_VERSION//./\\.}"
  workshop exec -I </dev/null -- sudo -Hu rea bash -c 'cd /var/lib/hermes-rea/work && exec "$@"' -- /usr/local/bin/hermes-rea-stdio --version | MATCH "${EXPECTED_VERSION//./\\.}"
  workshop exec -I </dev/null -- bash -lc 'java -version 2>&1' | MATCH '25'
  workshop exec -I </dev/null -- test -r /etc/ssh/sshd_config.d/60-hermes-rea.conf
  workshop info | MATCH 'status:\s+ready'
  workshop exec -I </dev/null -- sudo -Hu rea bash -c 'cd /var/lib/hermes-rea/work && exec "$@"' -- python3 /project/functional.py --output /var/lib/hermes-rea/work/sdk-validation-launch --only cli,mcp-catalog,javascript,archive,evidence
  workshop exec -I </dev/null -- sudo -Hu rea bash -c 'cd /var/lib/hermes-rea/work && exec "$@"' -- python3 /project/ssh_boundary.py --output /var/lib/hermes-rea/work/sdk-validation-ssh-boundary
debug: |
  workshop info || true
  workshop tasks || true
  workshop exec -I </dev/null -- sudo cat /var/lib/hermes-rea/work/sdk-validation-launch/results.json || true
