prepare: |
  cp ../launch/*.py ../launch/*.mjs .
  cp ../launch/*-fixtures.json .
  cp ../launch/static-fixtures-LICENSE.txt .
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  if [ "$CHECK" = desktop-build ]; then
    sed -i '/^sdks:$/a\  - name: docker-ce' workshop.yaml
  fi
  workshop launch
  workshop changes
  workshop tasks
  workshop info
  workshop exec -I </dev/null -- sudo apt-get update
  workshop exec -I </dev/null -- sudo eatmydata apt-get install gcc libc6-dev mono-mcs golang-go openbox
  case "$CHECK" in
    electron-*) workshop exec -I </dev/null -- sudo -Hu rea bash -c 'cd /var/lib/hermes-rea/work && exec "$@"' -- python3 /project/install_electron_fixture.py /var/lib/hermes-rea/work/electron-fixture ;;
  esac
restore: |
  workshop remove || true
  workshop changes
  workshop tasks
  # info returns exit1 after successful removal; list proves the final Off state.
  workshop info || true
  workshop list --no-headers | MATCH '[[:space:]]Off[[:space:]]'
  rm -f ./*.py ./*.mjs
  rm -f ./*-fixtures.json
  rm -f static-fixtures-LICENSE.txt
execute: |
  workshop info | MATCH 'status:\s+ready'
  workshop exec -I </dev/null -- sudo -Hu rea bash -c 'cd /var/lib/hermes-rea/work && exec "$@"' -- python3 /project/functional.py --output "/var/lib/hermes-rea/work/sdk-validation-$CHECK" --only "$CHECK" --require "$CHECK"
debug: |
  workshop info || true
  workshop tasks || true
  workshop exec -I </dev/null -- sudo cat "/var/lib/hermes-rea/work/sdk-validation-$CHECK/results.json" || true
