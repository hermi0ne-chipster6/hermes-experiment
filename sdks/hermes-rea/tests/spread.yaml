project: hermes-rea
path: /home/ubuntu/project
backends:
  lxd:
    systems:
    - ubuntu-24.04:
        username: ubuntu
        vm: true
suites:
  main/:
    summary: Verify hermes-rea
    environment:
      BASE/resolute: ubuntu@26.04
      EXPECTED_VERSION: '$(HOST: cat "`git rev-parse --show-toplevel`/sdks/hermes-rea/VERSION")'
