# The release archive and SHA-256 are recorded in ../../sources.json.
name: sui-cli
adopt-info: sui
summary: Pinned Sui command-line client
description: Sui CLI with a persistent mount for operator wallet configuration.
license: Apache-2.0
base: ubuntu@26.04
platforms:
  amd64: null
plugs:
  sui-state:
    interface: mount
    workshop-target: /home/workshop/.sui
    mode: 448
parts:
  sui:
    plugin: dump
    source: build-source
    source-type: local
    build-packages:
      - ca-certificates
      - curl
    override-pull: |
      craftctl set version="$(cat "$CRAFT_PROJECT_DIR/VERSION")"
      curl -fL --connect-timeout 30 --max-time 900 'https://github.com/MystenLabs/sui/releases/download/mainnet-v1.82.3/sui-mainnet-v1.82.3-ubuntu-x86_64.tgz' -o "$CRAFT_PART_SRC/sui.tgz"
      printf '%s  %s\n' 'd616d63d90309926cf7f544633c8dd4132f762fdbba555a35c4842cfa4129379' "$CRAFT_PART_SRC/sui.tgz" | sha256sum -c -
      mkdir -p "$CRAFT_PART_SRC/unpacked" "$CRAFT_PART_SRC/sui/bin"
      tar -xzf "$CRAFT_PART_SRC/sui.tgz" -C "$CRAFT_PART_SRC/unpacked" --occurrence=1 --wildcards --no-anchored sui
      SUI=$(find "$CRAFT_PART_SRC/unpacked" -type f -name sui -print -quit)
      test -n "$SUI"
      install -m 755 "$SUI" "$CRAFT_PART_SRC/sui/bin/sui"
      rm -rf "$CRAFT_PART_SRC/unpacked" "$CRAFT_PART_SRC/sui.tgz"
