summary: Launch the packaged Hermes SDK and verify its identity
prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch
restore: |
  workshop remove
execute: |
  workshop exec -- bash -ec '
    sdk=/var/lib/workshop/sdk/hermes-experiment
    version=$("$sdk/bin/python" -I -c "import json,sys; print(json.load(open(sys.argv[1]))[\"baseVersion\"])" "$sdk/share/hermes/core-pin.json")
    hermes --version | grep -F "Hermes Agent v$version "
    if hermes update; then
      echo "Packaged core update unexpectedly succeeded" >&2
      exit 1
    fi
  '
  workshop exec -- bash -lc 'buzz --help' | MATCH 'Usage'
  workshop exec -- bash -ec 'test ! -e /usr/local/bin/sui; test ! -e /usr/local/bin/link-cli'
  workshop exec -- bash -lc 'test -e /var/lib/workshop/sdk/hermes-experiment/plugins/hermes_otel/dashboard'
  workshop info | MATCH 'status:\s+ready'
debug: |
  workshop info || true
  workshop tasks || true
