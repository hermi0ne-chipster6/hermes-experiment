summary: Packaged core starts without a connected model secret
prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch
restore: |
  workshop remove
execute: |
  if workshop exec -- workshopctl get-secret hermes-experiment.model-key >/dev/null 2>&1; then
    echo 'Unexpected connected test credential' >&2
    exit 1
  fi
  workshop exec -- bash -ec '
    sdk=/var/lib/workshop/sdk/hermes-experiment
    version=$("$sdk/bin/python" -I -c "import json,sys; print(json.load(open(sys.argv[1]))[\"baseVersion\"])" "$sdk/share/hermes/core-pin.json")
    hermes --version | grep -F "Hermes Agent v$version "
  '
debug: |
  workshop info || true
  workshop tasks || true
