# Derived from pinned upstream SDK patterns and Canonical templates; see ../../sources.json.
name: hermes-experiment
adopt-info: hermes-agent
summary: "Hermes Agent \u2014 self-improving AI agent from Nous Research"
description: Official stable Hermes runtime for Hermes Experiment 1. Native Buzz and email gateway configuration
  and agent state persist across Workshop refreshes. Credentials are supplied separately at runtime.
license: MIT
website: https://github.com/NousResearch/hermes-agent
platforms:
  amd64: null
plugs:
  state:
    interface: mount
    workshop-target: /home/workshop/.hermes
    mode: 448
  hindsight:
    interface: mount
    workshop-target: /home/workshop/.hindsight
    mode: 448
  diary:
    interface: tunnel
    endpoint: /run/user/1000/hermes-diary.sock
  model-key:
    interface: secret
  buzz-key:
    interface: secret
  email-password:
    interface: secret
  sui-state:
    interface: mount
    workshop-target: /home/workshop/.sui
    mode: 448
  link-state:
    interface: mount
    workshop-target: /home/workshop/.link-cli
    mode: 448
  sandbox-api-key:
    interface: secret
  configuration:
    interface: mount
    workshop-target: /etc/hermes-experiment
    read-only: true
    uid: 0
    gid: 0
    mode: 493
  rea-ssh-key:
    interface: secret
parts:
  hermes-agent:
    plugin: uv
    source: build-source
    build-snaps:
    - astral-uv
    build-environment:
    - UV_NO_EDITABLE: '1'
    - UV_PYTHON_DOWNLOADS: manual
    - UV_PYTHON_PREFERENCE: managed
    build-packages:
    - curl
    - ca-certificates
    - git
    - gcc
    - g++
    - make
    - libffi-dev
    - libolm-dev
    override-pull: 'VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")

      craftctl set version="$VERSION"

      rm -rf "$CRAFT_PART_SRC/upstream"

      git clone --depth 1 --branch "v${VERSION}" https://github.com/NousResearch/hermes-agent.git "$CRAFT_PART_SRC/upstream"

      cd "$CRAFT_PART_SRC/upstream"

      test "$(git rev-parse HEAD)" = "bf0203a794a07aac3ff764972ab9087baa4e4f4e"

      '
    override-build: 'export UV_PYTHON_INSTALL_DIR="$CRAFT_PART_INSTALL/python-runtime"

      uv python install 3.14.7

      PYTHON=$(uv python find 3.14.7)

      uv venv --seed --allow-existing --relocatable --python "$PYTHON" "$CRAFT_PART_INSTALL"

      PYTHON_REL=$(realpath --relative-to="$CRAFT_PART_INSTALL/bin" "$PYTHON")

      ln -snf "$PYTHON_REL" "$CRAFT_PART_INSTALL/bin/python"

      ln -snf python "$CRAFT_PART_INSTALL/bin/python3"

      ln -snf python "$CRAFT_PART_INSTALL/bin/python3.14"

      export PATH="$CRAFT_STAGE/node/bin:$PATH"

      cd "$CRAFT_PART_SRC/upstream"

      npm ci --ignore-scripts --workspace web --workspace ui-tui

      npm run build --workspace web

      npm run build --workspace ui-tui

      VIRTUAL_ENV="$CRAFT_PART_INSTALL" uv sync --frozen --no-dev --no-editable --no-install-project --no-install-package
      browser-harness --extra web

      uv pip install --exclude-newer 2026-10-28T00:00:00Z --python "$CRAFT_PART_INSTALL/bin/python" --require-hashes
      -r "$CRAFT_PROJECT_DIR/plugin-requirements.txt"

      uv pip check --python "$CRAFT_PART_INSTALL/bin/python"

      mkdir -p "$CRAFT_PART_INSTALL/hermes-src"

      git archive HEAD | tar -x -C "$CRAFT_PART_INSTALL/hermes-src"

      cp -r hermes_cli/web_dist "$CRAFT_PART_INSTALL/hermes-src/hermes_cli/"

      install -D ui-tui/dist/entry.js "$CRAFT_PART_INSTALL/hermes-src/hermes_cli/tui_dist/entry.js"

      # Use upstream''s canonical stamp builder; no project wheel, Nix guard override,

      # editable finder, mutable source checkout, or runtime application installer.

      "$CRAFT_PART_INSTALL/bin/python" -c ''import runpy,sys; runpy.run_path("scripts/write_install_stamp.py")["write_stamp"](sys.argv[1],
      update_mechanism="external", commit="bf0203a794a07aac3ff764972ab9087baa4e4f4e", base_version="0.22.5", distance=0,
      dirty=False, source="ci", distribution="sdkcraft")'' "$CRAFT_PART_INSTALL/hermes-src/install-stamp.json"

      install -D SOUL.md "$CRAFT_PART_INSTALL/share/hermes/SOUL.md"

      uv pip freeze --python "$CRAFT_PART_INSTALL/bin/python" > "$CRAFT_PART_INSTALL/share/hermes/dependencies.txt"

      '
    after:
    - node-runtime
    source-type: local
  node-runtime:
    plugin: dump
    source: https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64.tar.xz
    source-checksum: sha256/d28a96af6c38596f6d9d97c0ee531c13d238d757742387d1928de822d959e997
    organize:
      '*': node/
  services:
    plugin: dump
    source: services
    source-type: local
  integration-assets:
    plugin: dump
    source: assets
    source-type: local
    organize:
      bootstrap/hermes: bin/hermes
  buzz-cli:
    plugin: dump
    source: build-source
    build-packages:
    - curl
    - ca-certificates
    override-pull: 'curl -fL ''https://github.com/block/buzz/releases/download/desktop-v0.5.28/Buzz_0.5.28_amd64.deb''
      -o "$CRAFT_PART_SRC/buzz.deb"

      echo ''53609fa586a787871f080b0bfce679633e457f650982411c81ba104648c388cb  ''"$CRAFT_PART_SRC/buzz.deb" | sha256sum
      -c -

      dpkg-deb -x "$CRAFT_PART_SRC/buzz.deb" "$CRAFT_PART_SRC/unpacked"

      install -D -m 755 "$CRAFT_PART_SRC/unpacked/usr/bin/buzz" "$CRAFT_PART_SRC/buzz/bin/buzz"

      rm -rf "$CRAFT_PART_SRC/unpacked" "$CRAFT_PART_SRC/buzz.deb"

      '
    source-type: local
  finance:
    plugin: dump
    source: npm
    source-type: local
    after:
    - node-runtime
    override-build: 'export PATH="$CRAFT_STAGE/node/bin:$PATH"

      npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      mkdir -p "$CRAFT_PART_INSTALL/finance"

      cp -a node_modules package.json package-lock.json "$CRAFT_PART_INSTALL/finance/"

      '
  official-plugins:
    plugin: dump
    source: build-source
    build-packages:
    - git
    override-pull: 'set -eu

      git clone --filter=blob:none --no-checkout ''https://github.com/vectorize-io/hindsight'' "$CRAFT_PART_SRC/repo-hindsight"

      cd "$CRAFT_PART_SRC/repo-hindsight"

      git fetch --depth 1 origin d952b6e655fccab4581ee0722b51c5f103873d12

      mkdir -p "$CRAFT_PART_SRC/plugins/hindsight"

      git archive d952b6e655fccab4581ee0722b51c5f103873d12:hindsight-integrations/hermes | tar -x -C "$CRAFT_PART_SRC/plugins/hindsight"

      cd "$CRAFT_PART_SRC"

      rm -rf "$CRAFT_PART_SRC/repo-hindsight"

      git clone --filter=blob:none --no-checkout ''https://github.com/briancaffey/hermes-otel'' "$CRAFT_PART_SRC/repo-hermes_otel"

      cd "$CRAFT_PART_SRC/repo-hermes_otel"

      git fetch --depth 1 origin d234865b13e997e0b3a50dc18aaad7c7d7b1b1fe

      mkdir -p "$CRAFT_PART_SRC/plugins/hermes_otel"

      git archive d234865b13e997e0b3a50dc18aaad7c7d7b1b1fe:hermes_otel | tar -x -C "$CRAFT_PART_SRC/plugins/hermes_otel"

      cd "$CRAFT_PART_SRC"

      rm -rf "$CRAFT_PART_SRC/repo-hermes_otel"

      git clone --filter=blob:none --no-checkout ''https://github.com/NousResearch/hermes-official-plugins'' "$CRAFT_PART_SRC/repo-rea"

      cd "$CRAFT_PART_SRC/repo-rea"

      git fetch --depth 1 origin 1690b63a4790cb821fb6a319ba524815d4e09411

      mkdir -p "$CRAFT_PART_SRC/plugins/rea"

      git archive 1690b63a4790cb821fb6a319ba524815d4e09411:rea | tar -x -C "$CRAFT_PART_SRC/plugins/rea"

      cd "$CRAFT_PART_SRC"

      rm -rf "$CRAFT_PART_SRC/repo-rea"

      '
    source-type: local
  sui:
    plugin: dump
    source: build-source
    build-packages:
    - curl
    - ca-certificates
    override-pull: 'curl -fL ''https://github.com/MystenLabs/sui/releases/download/mainnet-v1.82.3/sui-mainnet-v1.82.3-ubuntu-x86_64.tgz''
      -o "$CRAFT_PART_SRC/sui.tgz"

      echo ''d616d63d90309926cf7f544633c8dd4132f762fdbba555a35c4842cfa4129379  ''"$CRAFT_PART_SRC/sui.tgz" | sha256sum
      -c -

      mkdir -p "$CRAFT_PART_SRC/unpacked" "$CRAFT_PART_SRC/sui/bin"

      tar -xzf "$CRAFT_PART_SRC/sui.tgz" -C "$CRAFT_PART_SRC/unpacked" --occurrence=1 --wildcards --no-anchored
      sui

      SUI=$(find "$CRAFT_PART_SRC/unpacked" -type f -name sui -print -quit)

      test -n "$SUI"

      install -m 755 "$SUI" "$CRAFT_PART_SRC/sui/bin/sui"

      rm -rf "$CRAFT_PART_SRC/unpacked" "$CRAFT_PART_SRC/sui.tgz"

      '
    source-type: local
  hindsight-runtime:
    plugin: dump
    source: build-source
    build-snaps:
    - astral-uv
    after:
    - hermes-agent
    override-build: 'uv venv --seed --relocatable --python "$CRAFT_STAGE/bin/python" "$CRAFT_PART_INSTALL/hindsight"

      ln -snf ../../python-runtime/cpython-3.14.7-linux-x86_64-gnu/bin/python3.14 "$CRAFT_PART_INSTALL/hindsight/bin/python"

      # During build the relative interpreter lives in stage; install using its absolute build path.

      uv pip install --exclude-newer 2026-10-28T00:00:00Z --python "$CRAFT_STAGE/bin/python" --target "$CRAFT_PART_INSTALL/hindsight/lib/python3.14/site-packages"
      --require-hashes -r "$CRAFT_PROJECT_DIR/hindsight-requirements.txt"

      '
base: ubuntu@26.04
